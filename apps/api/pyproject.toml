[project]
name = "blog-it-api"
version = "0.0.0"
description = "Blog-it HTTP API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "motor>=3.4",
    "cryptography>=42",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pillow>=10.0",
    "kiwipiepy>=0.18",
    "redis>=5.0",
    "selenium>=4.15",
    "undetected-chromedriver>=3.5",
    "setuptools>=68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Resolved against rootdir (apps/api), so `app` imports work when pytest is
# invoked from the repo root — which is what `npm run api:test` does.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
