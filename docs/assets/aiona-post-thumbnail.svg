<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="thumb-title thumb-desc">
  <title id="thumb-title">AIONA 게시물 썸네일 템플릿</title>
  <desc id="thumb-desc">차콜 배경에 큰 제목 문구와, 이 글에서 쓴 기능 이름이 아래에 작게 들어가는 정사각 썸네일 템플릿.</desc>

  <!--
    게시물별 썸네일 **템플릿**(정사각 800 × 800 — 네이버 목록·검색 결과에서 잘리지 않는 비율).

    업종별 대문을 여러 개 만드는 대신 이쪽을 쓴다. AIONA 블로그는 그 자체로 하나의 브랜드
    블로그라, 대문은 하나면 되고 **글마다 달라져야 하는 것은 썸네일**이다. 대문을 여러 개
    두면 방문자는 어느 것이 이 블로그인지 알 수 없다.

    고치는 곳은 두 군데뿐이다:
      1. `data-slot="headline"` — 글의 제목. 두 줄까지. 세 줄이 되면 글자를 줄인다.
      2. `data-slot="feature"` — 이 글에서 실제로 쓴 기능 이름. **기준표에 있는 이름만.**
         쓰지 않았으면 그 그룹을 통째로 지운다(없는 것을 적는 것보다 비는 편이 낫다).

    브랜드 표시는 오른쪽 아래 워드마크 하나로 충분하다. 썸네일은 목록에서 작게 보이는
    자리라, 로고를 키우면 정작 무슨 글인지가 안 읽힌다 — 검색으로 들어오는 사람이
    누르는 이유는 브랜드가 아니라 제목이다.
  -->

  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1B1E25"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="t-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE001"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE001" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFE001" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#t-bg)"/>
  <ellipse cx="700" cy="90" rx="360" ry="280" fill="url(#t-glow)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <!-- 위쪽 눈금. 제목이 어디서 시작하는지 눈이 잡을 자리를 준다. -->
    <rect x="72" y="188" width="72" height="6" rx="3" fill="url(#t-accent)"/>

    <g data-slot="headline">
      <text x="72" y="330" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-1.5">
        여기에 글 제목을
      </text>
      <text x="72" y="412" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-1.5">
        두 줄까지
      </text>
    </g>

    <text x="72" y="476" fill="#9AA0AB" font-size="26" letter-spacing="-0.4" data-slot="subline">
      한 줄 설명이 필요하면 여기에
    </text>

    <!-- 이 글에서 쓴 기능. 쓰지 않았으면 이 그룹을 통째로 지운다. -->
    <g data-slot="feature" transform="translate(72 604)">
      <rect x="0" y="0" width="330" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <g transform="translate(26 18)" fill="none" stroke="#FFE001" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6.5"/>
        <path d="M12.8 12.8 L18 18"/>
      </g>
      <text x="66" y="36" fill="#E4E7EC" font-size="21" font-weight="650">자료 조사로 확인했어요</text>
    </g>

    <text x="728" y="700" fill="#FFFFFF" fill-opacity="0.72" font-size="24" font-weight="800" letter-spacing="4" text-anchor="end">AIONA</text>
  </g>
</svg>
